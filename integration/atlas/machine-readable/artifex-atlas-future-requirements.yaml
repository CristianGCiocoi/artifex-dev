required_contract_properties:
  - "Capability-neutral provider selection; no vendor-name branching outside an adapter."
  - "Standalone ARTIFEX operation remains valid when ATLAS is absent or degraded."
  - "ARTIFEX retains semantic state, acceptance, gate, evidence, and lifecycle authority."
  - "Execution/result envelopes bind base commit, contract fingerprint, and project-model fingerprint."
  - "Version negotiation and additive extension without silent semantic reinterpretation."
  - "Explicit failure, cancellation, timeout, and stale-result semantics."
  - "Secret-safe provenance, least privilege, and scoped repository/artifact access."
potential_architectural_conflicts:
  - id: "PAC-001"
    requirement: "Git/files remain ARTIFEX semantic truth; databases/services may coordinate but must not own semantic meaning."
    reason: "A platform contract that centralizes canonical lifecycle or acceptance state would create a competing authority."
    impact: "Broken reconstructability, ambiguous recovery, and invalid evidence ownership."
    options:
      - "Platform provides opaque coordination only; ARTIFEX persists canonical decisions locally."
      - "Use exported, versioned projections with ARTIFEX-origin provenance."
    recommendation: "Treat ARTIFEX state/evidence writes as owner-controlled imports, never platform-authoritative mutations."
  - id: "PAC-002"
    requirement: "Portable transcript-independent execution packets and result envelopes."
    reason: "Opaque server-side sessions or provider-specific task state cannot be the only execution record."
    impact: "Loss of cross-interface continuity and inability to classify stale/rebased results."
    options:
      - "Require portable packet/result contracts and durable correlation IDs."
      - "Keep provider session data auxiliary and exportable."
    recommendation: "Make provider-native session state optional metadata, not a required recovery dependency."
  - id: "PAC-003"
    requirement: "Standalone, no mandatory daemon/DB/network control plane in V1."
    reason: "Mandatory ATLAS reachability, a specific gateway, or an always-on agent would violate released ARTIFEX constraints."
    impact: "Reduced portability and blocked offline/local workflows."
    options:
      - "Optional capability provider with local fallbacks."
      - "Explicit future server profile that is opt-in."
    recommendation: "Contract consumers must negotiate optional capabilities and degrade explicitly rather than fail startup."
acceptance_for_platform_orchestrator:
  - "Map every PROBABLE/NEEDED ARTIFEX capability to an optional, versioned platform capability or record a deliberate non-coverage."
  - "Verify no platform semantic-state write can bypass ARTIFEX validation/gate authority."
  - "Verify unavailable/degraded platform behavior preserves standalone ARTIFEX paths."
  - "Verify extension fields are ignorable or version-negotiated, never silently reinterpreted."
  - "Do not produce an implementation handoff until a real ARTIFEX integration trigger, target, and authorization exist."
