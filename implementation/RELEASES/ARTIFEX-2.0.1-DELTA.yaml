product_impacts:
- source: src/artifex/_version.py
  affected_public_behavior:
  - Public version, package metadata and release identity report ARTIFEX 2.0.1.
  provider_roles: [provider-neutral]
  platforms: {windows: VERSION_ADVANCED, linux: VERSION_ADVANCED, macos: VERSION_ADVANCED}
  affected_journeys: [J01, J02, J10, J11, J16, J20]
- source: src/artifex/managed_service.py
  affected_public_behavior:
  - Managed-service state and transport credentials remain accessible only to the exact current user and LocalSystem on Windows.
  - Provider workspace roots explicitly inherit their parent DACL so provider sandbox identities can traverse authorized workspaces.
  - The built-in Administrator LA alias is accepted only for the exact current SID with reserved RID 500.
  - Windows process-owner probing is unchanged at runtime; Linux and macOS can import and typecheck the guarded branch without advertising Windows support.
  provider_roles: [Codex, Claude, ManualIntegration, combined Codex+Claude]
  platforms:
    windows: BEHAVIOR_CORRECTED
    linux: IMPORT_TYPECHECK_CONFIRMED_RUNTIME_UNCHANGED
    macos: IMPORT_TYPECHECK_CONFIRMED_RUNTIME_UNCHANGED
  affected_journeys: [J01, J02, J10, J11, J16, J20]
- source: src/artifex/distribution/lifecycle.py
  affected_public_behavior:
  - Install, upgrade and uninstall reject Windows absolute or drive-qualified manifest paths even when validation runs on POSIX.
  - Valid relative artifact paths and manifest-owned cleanup behavior remain unchanged.
  provider_roles: [provider-neutral]
  platforms:
    windows: PATH_CONTAINMENT_HARDENED
    linux: CROSS_HOST_WINDOWS_PATH_REJECTION_ADDED
    macos: CROSS_HOST_WINDOWS_PATH_REJECTION_ADDED
  affected_journeys: [J01, J02, J10, J20]
journey_qualification:
  rerun:
  - id: J01
    reason: Codex standalone uses the installed Windows managed service and provider workspace ACL.
  - id: J02
    reason: Claude standalone uses the installed Windows managed service and provider workspace ACL.
  - id: J10
    reason: No-provider startup always prepares and validates managed-service state and workspace roots.
  - id: J11
    reason: Cross-provider continuity uses managed-service restart, persisted setup and provider workspaces.
  - id: J16
    reason: Provider setup persistence crosses the managed-service restart and private-state boundary.
  - id: J20
    reason: Full installed lifecycle uses the managed service, provider workspaces and restart recovery.
  proven_unaffected:
  - {id: J03, reason: Project continuity uses ProjectRepository/public CLI; neither changed source module participates.}
  - {id: J04, reason: Multi-session interaction governance does not import distribution lifecycle or managed_service.}
  - {id: J05, reason: Uses artifex.runtime ManagedRuntimeService and RunStore directly; managed_service host and distribution lifecycle are not invoked.}
  - {id: J06, reason: Material-decision governance surface is outside both changed source modules.}
  - {id: J07, reason: Pause/recovery governance surface is outside both changed source modules.}
  - {id: J08, reason: Documentation/dashboard projection source is unchanged.}
  - {id: J09, reason: V1 semantic migration and rollback use migration authority, not distribution lifecycle artifact cleanup or managed_service.}
  - {id: J12, reason: Organizational knowledge source and public composition are unchanged.}
  - {id: J14, reason: External reality drift source and public composition are unchanged.}
  - {id: J15, reason: Uses artifex.runtime ExecutionWorkspace with an explicit workspace root, not managed_service ServicePaths.}
  - {id: J18, reason: UNKNOWN reconciliation uses RunStore/runtime transitions, not the changed managed-service host.}
  - {id: J19, reason: Collaborative lifecycle governance source is unchanged.}
