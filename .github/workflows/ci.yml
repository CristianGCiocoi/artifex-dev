name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # ARTIFEX 2.x control-plane tests verify accepted milestone ancestry
          # and the immutable V1 tag. Those tests require the actual history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run coverage erase
      - run: uv run coverage run --branch -m pytest -p no:pytest_cov --ignore=tests/test_release.py
      - run: uv run coverage report

  preserved-v1-regression:
    name: preserved-v1-regression (V1-R01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Reproduce the frozen V1 dashboard fixture/schema-drift regression
        shell: bash
        run: |
          set -euo pipefail
          legacy_root="$RUNNER_TEMP/artifex-v1-regression"
          git worktree add --detach "$legacy_root" 5cc5dcfeb420a6df171a44426c04a0f08fa1e877
          cd "$legacy_root"
          uv sync --locked --all-groups
          set +e
          uv run --frozen pytest -vv -x \
            tests/test_release.py::test_candidate_passes_without_optional_m10_gate \
            --disable-warnings 2>&1 | tee "$RUNNER_TEMP/v1-r01.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 1
          grep -F "dashboard is not deterministic noncanonical candidate-bound output" \
            "$RUNNER_TEMP/v1-r01.log"
          grep -F "'release' is a required property" "$RUNNER_TEMP/v1-r01.log"
          echo "V1-R01-DASHBOARD-FIXTURE-SCHEMA-DRIFT: REPRODUCED_AND_PRESERVED"

  native-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: native-linux-x64
          - os: windows-latest
            kind: native-windows-x64
          - os: macos-latest
            kind: native-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run python packaging/build.py --clean --smoke
      - run: uv run python scripts/validate_current_artifacts.py validate-native --candidate "${{ github.sha }}" --input dist/native/artifex --kind "${{ matrix.kind }}"
      - run: uv build --no-build-isolation --wheel --sdist
      - run: uv run python scripts/validate_current_artifacts.py validate-source --candidate "${{ github.sha }}" --output dist
      - run: uv run python scripts/validate_current_artifacts.py smoke-source --candidate "${{ github.sha }}" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: artifex-onedir-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/native/artifex/
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv lock --check
      - run: uv build --no-build-isolation --wheel --sdist
      - run: uv run python scripts/validate_current_artifacts.py validate-source --candidate "${{ github.sha }}" --output dist
      - run: uv run python scripts/validate_current_artifacts.py smoke-source --candidate "${{ github.sha }}" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: artifex-source-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  windows-installer:
    name: windows-installer (Nuitka + NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run python packaging/build_windows_installer.py --clean --smoke
      - run: uv run python scripts/validate_current_artifacts.py validate-windows-installer --candidate "${{ github.sha }}" --input dist/windows
      - uses: actions/upload-artifact@v4
        with:
          name: artifex-windows-installer
          path: |
            dist/windows/ARTIFEX-Setup.exe
            dist/windows/ARTIFEX-Setup.provenance.json
            dist/windows/artifex/
          if-no-files-found: error
