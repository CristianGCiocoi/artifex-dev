[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "artifex-dev"
version = "2.0.1"
description = "Agent-neutral development control, continuity, and understanding layer"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "ARTIFEX Contributors"}]
dependencies = [
  "jsonschema>=4.23,<5",
  "pyyaml>=6.0.2,<7",
  "typer>=0.16,<1",
]

[project.scripts]
artifex = "artifex.cli:app"
artifex-mcp = "artifex.mcp:main"

[dependency-groups]
dev = [
  "hatchling==1.27.0",
  "hypothesis>=6.130,<7",
  "mypy>=1.15,<2",
  "nuitka[standalone]==4.2",
  "pyinstaller>=6.12,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/artifex"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/acceptance-evidence.schema.json" = "artifex/schemas/acceptance-evidence.schema.json"
"schemas/artifex2/provider-role-certification.schema.json" = "artifex/schemas/artifex2/provider-role-certification.schema.json"
"interface_packs/codex" = "artifex/interface_packs/codex"
"interface_packs/claude" = "artifex/interface_packs/claude"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]
markers = [
  "unit: isolated deterministic tests",
  "integration: multi-component tests",
  "architecture: dependency and invariant tests",
  "adversarial: failure and trust-boundary tests",
  "conformance: integration contract tests",
  "packaging: frozen distribution tests",
  "slow: tests excluded from the default fast loop",
]

[tool.coverage.run]
branch = true
source = ["artifex"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
  '\.\.\.$',
  'if __name__ == .__main__.:',
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["artifex"]
