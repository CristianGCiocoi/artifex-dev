acceptance_criteria:
  - Evidence schema 2.0 and typed codec round-trip EvidenceEntry exactly.
  - Canonical parsing verifies integrity, schema version, validator identity, and independence.
  - Known old shapes classify as LEGACY_HISTORICAL and cannot become current evidence.
  - Unknown, tampered, duplicate, spoofed, or stale evidence fails closed.
  - Release verifier measures repository state and reports unmet final conditions without mutating state.
  - Traceability validation requires architecture, milestone, task, evidence, and gate coverage for every requirement.
  - Core/package/CLI/artifact identity is consistently 1.0.0.
  - All six integrations support Core 1.0.0 and reject Core 2.0.0.
  - CI builds locked wheel and sdist and performs isolated identity smoke.
  - Focused/adversarial tests, Ruff, strict mypy, full tests, and at least 85 percent coverage pass.
  - Wheel and sdist build successfully from the frozen source.
  - Independent review passes with no Core authority escape.
