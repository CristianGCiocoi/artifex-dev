acceptance_criteria:
  - Evidence schema 2.0, EvidenceLedger journal events, and typed YAML/JSON codec use one EvidenceEntry payload representation.
  - Canonical parsing verifies schema, integrity, trusted validator, independence, and exact current binding; known legacy remains historical only.
  - Unknown, tampered, duplicate, spoofed, stale, path-escaping, or symlink evidence fails closed.
  - Candidate verifier derives binding from actual Git HEAD, current canonical Project Model, and Core-owned V1 release contract, never from the release manifest.
  - Candidate verifier requires M11 VALIDATING and release CANDIDATE, then permits Core promotion only after PASS.
  - Mandatory gates are M00-M09, M11, and V1; M10 is optional and non-blocking; each mandatory gate must parse and be PASS/non-waivable/current-evidence-bound.
  - BUILD, VALIDATION, UNDERSTANDING, CONTINUITY, PORTABILITY, PACKAGING, SELFHOST, SECURITY, and V1 aggregate evidence are individually required and PASS.
  - Artifact paths and kinds are unique, in-root regular files with matching hashes; relabeling one file cannot satisfy multiple kinds.
  - Traceability definitions are checked against authoritative repository artifacts and every requirement maps to architecture, milestone, task, evidence, and gate.
  - Core/package/CLI/artifact identity is consistently 1.0.0 and all six integrations support 1.0.0 but reject 2.0.0.
  - Existing nine CI jobs remain, locked wheel/sdist isolated identity CI is added, and source builds pass.
  - Focused/adversarial tests, Ruff, strict mypy, full tests, coverage at least 85 percent, and independent review pass.
