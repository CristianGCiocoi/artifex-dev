acceptance_criteria:
  - Known pre-2 ledger events are strictly historical, never current or gate-satisfying, never rewritten, and permit schema-2 append; unknown legacy fails closed.
  - M00-M09 gates validate immutable historical gate, raw contract hash, and known legacy evidence binding without promotion; absent M10 is valid.
  - M11 requires exactly eight current category evidence IDs and V1 requires only the aggregate; both gates are PASS, nonwaivable, and bound to the raw V1 contract hash.
  - EVD-V1-RELEASE contains the exact evidence ID to entry-hash aggregation for all eight M11 category entries; missing, extra, duplicate, or mismatched members fail.
  - The V1 contract names an immutable integrated source candidate S, its Project Model fingerprint, and trusted validator specifications including ID, version, allowed kind, and producer authority; evidence and independent-validation audit provenance match those fields and bind to S, the raw contract hash, and that fingerprint.
  - The verifier runs at a clean committed governance commit G, proves S is an ancestor, proves the canonical model equals S, and restricts S..G to a frozen Core governance allowlist with no source or runtime changes.
  - Status, contract, evidence, gates, manifest, traceability, generated documentation, and audit inputs are tracked and clean at G; only declared hashed release artifacts may remain external or ignored.
  - Artifact path, kind, inode, and digest are unique; wheel, sdist, and native content plus embedded product, version, platform, architecture, and source-S provenance are mechanically verified.
  - Traceability authority comes from the schema-valid typed Project Model and parsed internally consistent evidence and gate identities, never filenames, empty files, or declarations alone.
  - Evidence schema 2.0, EvidenceLedger journal events, and typed YAML or JSON codec use one EvidenceEntry payload representation for all new writes.
  - Core, package, CLI, and artifact identity is 1.0.0; all six integrations support 1.0.0 and reject 2.0.0.
  - The build backend and source-package tooling are reproducibly pinned or constrained; existing nine CI jobs remain and isolated wheel plus sdist identity checks pass.
  - Focused and adversarial tests, Ruff, strict mypy, full tests, coverage at least 85 percent, source builds, and independent review pass.
